name: Release

# Pushing a tag like v1.0.0 builds the Windows executable and publishes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # lets you dry-run the build without tagging

permissions:
  contents: write         # needed to create the release

jobs:
  build:
    runs-on: windows-latest   # a Windows .exe has to be built on Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          code_version=$(python -c "import viewer; print(viewer.__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "code=$code_version tag=$tag_version"
          if [ "$code_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ ($code_version) in viewer.py"
            exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

      - name: Build executable
        run: pyinstaller csv-viewer.spec

      - name: Smoke-test the build
        shell: pwsh
        run: |
          # the app is a GUI, so "did it start and stay up?" is the check
          $p = Start-Process dist\CSVViewer\CSVViewer.exe -ArgumentList examples\sample.csv -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "the executable exited on its own (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "started and stayed running"

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="dev-${GITHUB_SHA::7}"
          name="CSVViewer-$version-windows-x64"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          cd dist && 7z a "../$name.zip" CSVViewer

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "CSV Viewer $GITHUB_REF_NAME" \
            --generate-notes
